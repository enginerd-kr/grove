name: Release

# A version tag is the release: pushing v0.1.0 gates on the full CI script,
# builds the four self-contained binaries the Homebrew tap serves, smoke-tests
# the one this runner can execute, and publishes the GitHub release whose
# assets the tap's formula points at.
on:
  push:
    tags:
      - "v*"

# `gh release create` writes the release; nothing else needs more than read.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with ci.yml — and with the Bun used locally. The
          # binaries embed this exact runtime, so the pin is part of the
          # release, not housekeeping.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The version reaches the binary as a package.json import inlined at
      # build time. A tag that disagrees with package.json would ship a binary
      # that reports the wrong version forever; refuse before building.
      - name: Assert tag matches package.json
        run: |
          pkg="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$pkg" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2; exit 1; }

      # CI runs on pull requests only, so the tag is the last gate between the
      # tree and the people brew hands these binaries to.
      - name: Lint, typecheck, test
        run: bun run ci

      - name: Compile binaries
        run: bash scripts/build-binaries.sh

      # Only the target this runner can execute. The darwin binaries are
      # verified by hand before the tap's formula learns a new version.
      - name: Smoke-test the linux binary
        run: bash scripts/smoke-compiled.sh dist/compile/linux-x64/garden

      - name: Checksums
        run: cd dist/release && shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/*.tar.gz dist/release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes
