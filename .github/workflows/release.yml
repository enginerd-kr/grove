name: Release

# A version tag is the release: pushing v0.1.0 checks that CI already passed on
# the tagged tree, builds the four self-contained binaries the Homebrew tap
# serves, smoke-tests the one this runner can execute, publishes the GitHub
# release whose assets the tap's formula points at, and bumps the tap. A second
# job then wraps the same four binaries as npm packages — @enginerd-kr/grove
# plus one package per platform — and publishes them with trusted publishing.
on:
  push:
    tags:
      - "v*"

# `gh release create` writes the release; nothing else needs more than read.
# The npm job narrows this for itself and adds the OIDC token it publishes with.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The CI gate below compares this commit's tree with its parents',
          # which a depth-1 clone does not have.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with ci.yml — and with the Bun used locally. The
          # binaries embed this exact runtime, so the pin is part of the
          # release, not housekeeping.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The version reaches the binary as a package.json import inlined at
      # build time. A tag that disagrees with package.json would ship a binary
      # that reports the wrong version forever; refuse before building.
      - name: Assert tag matches package.json
        run: |
          pkg="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$pkg" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2; exit 1; }

      # The banner's "What's new" column reads the changelog's first entry, and
      # the release notes below are cut from the same section. A tag whose
      # version the changelog does not lead with would ship a binary announcing
      # the previous release; refuse before building.
      - name: Assert CHANGELOG leads with this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          first="$(grep -m1 -E '^## ' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          test "$first" = "$v" \
            || { echo "CHANGELOG.md leads with '$first', tag wants '$v'" >&2; exit 1; }

      # CI runs on pull requests, so the tag has to be one CI already spoke for.
      # scripts/ci-vouched.sh finds the green run for this commit's tree — on
      # the commit, or on the PR head a merge commit shares its tree with — and
      # refuses a tree no run has seen. Nothing is run again: the suite already
      # answered on both operating systems, and a second run on this runner
      # could only answer on one.
      - name: Assert CI passed on this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-vouched.sh HEAD

      - name: Compile binaries
        run: bash scripts/build-binaries.sh

      # The npm job below wraps these same files, so it must not compile its
      # own: a second build is a second chance to differ from what the tap
      # serves. Uploaded before the smoke test on purpose — a failed smoke
      # fails this job, and the npm job never starts. The artifact is a zip,
      # and zip forgets the executable bit; scripts/build-npm.ts sets it again.
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/compile/
          if-no-files-found: error
          retention-days: 7

      # Only the target this runner can execute. The darwin binaries are
      # verified by hand before the tap's formula learns a new version.
      - name: Smoke-test the linux binary
        run: bash scripts/smoke-compiled.sh dist/compile/linux-x64/grove

      - name: Checksums
        run: cd dist/release && shasum -a 256 *.tar.gz > SHA256SUMS

      # The notes are the changelog's section for this version, not generated
      # from PR titles: the release page and the app's "What's new" column
      # should say the same thing, and the guard above proved the section is
      # there to cut.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" \
            '$0 ~ "^## " v "([^0-9]|$)" {on=1; next} /^## /{on=0} on' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/release/*.tar.gz dist/release/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      # The tap learns about the release by itself. A deploy key that can
      # reach nothing but enginerd-kr/homebrew-tap rewrites the formula's
      # version and checksums — only the numbers; the formula's words stay
      # the tap's — and pushes. scripts/bump-formula.sh refuses a half-done
      # rewrite, so a surviving push means every sum landed.
      - name: Bump the Homebrew formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:enginerd-kr/homebrew-tap.git tap
          bash scripts/bump-formula.sh tap/Formula/grove.rb "${GITHUB_REF_NAME#v}" dist/release/SHA256SUMS

          cd tap
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "grove ${GITHUB_REF_NAME#v}"
          git push

  # npm gets the four binaries the release above holds, in five packages: one
  # per platform holding bin/grove, and @enginerd-kr/grove, whose bin is a Node
  # launcher that runs the one npm chose by os/cpu. scripts/build-npm.ts writes
  # the five manifests from the root package.json, so the version the tag guard
  # above accepted is the version every package carries.
  #
  # Published with npm trusted publishing: the job's OIDC token is the
  # credential, and there is no NPM_TOKEN anywhere. The binding that lets it
  # publish lives in each package's settings on npmjs.com and names this
  # repository and this file by name — rename release.yml and publishing stops.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing arrived in npm 11.5.1. Node 24 ships a newer npm,
      # but the floor is what matters, so say it and enforce it.
      - name: Assert npm can do trusted publishing
        run: |
          need=11.5.1
          have="$(npm --version)"
          [ "$(printf '%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || npm install -g "npm@>=$need"
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/compile

      - name: Assemble the npm packages
        run: bun scripts/build-npm.ts

      # Through `npm pack` and the launcher, the way a user's install would run
      # it. Only the target this runner can execute.
      - name: Smoke-test the linux package through the launcher
        run: bash scripts/smoke-npm.sh linux-x64

      # Platform packages first: the main package pins them at this exact
      # version, and an installer that found the main one before its binaries
      # existed would install a launcher with nothing to launch. A version the
      # registry already has is skipped rather than failed, so re-running this
      # job after a flake finishes the set instead of stopping at the first
      # package it published last time.
      - name: Publish
        run: |
          v="${GITHUB_REF_NAME#v}"
          for pkg in grove-darwin-arm64 grove-darwin-x64 grove-linux-x64 grove-linux-arm64 grove; do
            if npm view "@enginerd-kr/${pkg}@${v}" version >/dev/null 2>&1; then
              echo "@enginerd-kr/${pkg}@${v} is already on the registry, skipping"
              continue
            fi
            (cd "dist/npm/${pkg}" && npm publish --provenance --access public)
          done
