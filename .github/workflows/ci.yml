name: CI

# Pull requests only: main is not pushed to directly, so every change reaches it
# through a PR that this workflow has already checked.
on:
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types are one fast job: they read the whole tree and say nothing
  # about runtime, so repeating them per shard would buy nothing.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun used locally. The floor is 1.3.5, which
          # added the PTY behind Bun.spawn({ terminal }); on anything older the
          # option is ignored, the child gets no terminal, and the end-to-end
          # tests in src/ui fail on the TTY guard rather than on a real defect.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Split out from the "ci" script so a failure points at the right step.
      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

  # The in-process tier: pure logic, and real git called as a function. Fast
  # enough to stay one job.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test
        run: bash scripts/test.sh --unit

  # The tier that spawns the real binary, over a pipe and a PTY. It is the
  # slowest part of the suite and the part that answers whether the built thing
  # works, so it is sharded rather than trimmed: `--shard` splits the files
  # across jobs that run at the same time, which is the parallelism that a
  # single machine could not give us — every worker there added its own git and
  # `cli.tsx` children until roughly one run in six died inside `spawn`.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide what the others
      # would have said.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test (shard ${{ matrix.shard }} of 3)
        run: bash scripts/test.sh --e2e --shard=${{ matrix.shard }}/3
