name: CI

# Pull requests only: main is not pushed to directly, so every change reaches it
# through a PR that this workflow has already checked.
on:
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types are one fast job: they read the whole tree and say nothing
  # about runtime, so repeating them per shard — or per OS — would buy nothing.
  # The tree a macOS runner would read is this same tree, byte for byte.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun used locally. The floor is 1.3.5, which
          # added the PTY behind Bun.spawn({ terminal }); on anything older the
          # option is ignored, the child gets no terminal, and the end-to-end
          # tests in src/ui fail on the TTY guard rather than on a real defect.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Split out from the "ci" script so a failure points at the right step.
      - name: Lint and format
        run: bunx biome ci .

      - name: Typecheck
        run: bunx tsc --noEmit

  # The in-process tier: pure logic, and real git called as a function. Fast
  # enough to stay one job, so the operating system is the only axis it has.
  #
  # macOS is on that axis because macOS is where most people install grove — the
  # tap is the way in — and because the tree already bends for it with nothing
  # checking the bends: `src/core/test-utils.ts` canonicalises `tmpdir()`
  # because `/var` is a symlink to `/private/var` there and git reports the path
  # it resolved to, not the one it was handed. Until this matrix the only darwin
  # check in the project was a person running `scripts/smoke-compiled.sh` by
  # hand before a release, which is somebody's memory standing where a runner
  # should be.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both report. "Is it broken everywhere or only on macOS" is the first
      # question a red unit run raises, and cancelling the sibling is precisely
      # how to leave it unanswered.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test (${{ matrix.os }})
        run: bash scripts/test.sh --unit

  # The tier that spawns the real binary, over a pipe and a PTY. It is the
  # slowest part of the suite and the part that answers whether the built thing
  # works, so it is sharded rather than trimmed: `--shard` splits the files
  # across jobs that run at the same time, which is the parallelism that a
  # single machine could not give us — every worker there added its own git and
  # `cli.tsx` children until roughly one run in six died inside `spawn`.
  #
  # Both operating systems get all three shards, and that is the expensive line
  # in this file: GitHub bills a macOS minute at ten times a Linux one, so three
  # macOS runners a PR is most of what CI costs. It is worth paying here and
  # nowhere else — this is the tier that answers "does the built thing work on
  # the machine it ships to", and Homebrew ships it to macOS. Cutting macOS to a
  # single shard would not even keep a third of the answer: which files land in
  # which shard is an accident of the sorted file list, so a trimmed matrix
  # would cover an arbitrary subset of the exact behaviour macOS is here for.
  e2e:
    name: e2e (${{ matrix.os }}, shard ${{ matrix.shard }} of 3)
    runs-on: ${{ matrix.os }}
    strategy:
      # Every shard reports, so one red shard does not hide what the others
      # would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test (${{ matrix.os }}, shard ${{ matrix.shard }} of 3)
        run: bash scripts/test.sh --e2e --shard=${{ matrix.shard }}/3

  # The README's pictures, retaken and held against the ones in the tree.
  #
  # `scripts/screens/shots.tsx` drives the real app over a real repository and
  # every shot checks its own contents before it is saved, so a picture that is
  # *wrong* already fails loudly. What nothing caught is a picture that is
  # merely *old*: the UI moves, nobody runs `bun run screenshots`, and the
  # README goes on showing a screen the program no longer draws — a fact that
  # surfaces months later, if ever, when somebody happens to compare the two by
  # eye. Retaking them is cheap; noticing by eye is what never happens.
  #
  # Nothing to arrange on the runner beyond git and bun: the fixture builds its
  # own repository under `tmpdir()`, reaches its origin over `file://` rather
  # than the network, and pins the identity with `GIT_CONFIG_GLOBAL=/dev/null`,
  # so the runner's git config is neither read nor written. Ubuntu alone,
  # because this job compares bytes with what was committed: a second OS could
  # only disagree about them, and would report a perfectly current picture as
  # drift on every PR.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Split from the comparison below so a red square says which of the two
      # happened: the shots themselves failing is a broken UI, and the tree
      # moving is a stale README.
      - name: Retake the README's pictures
        run: bun run screenshots

      - name: The pictures still match the UI
        run: |
          # A shot whose file was never committed is untracked, and `git diff`
          # is blind to those — so the newest picture in the tree would be the
          # one this misses. `--intent-to-add` is what makes it visible.
          git add --intent-to-add docs/screens
          if git diff --exit-code -- docs/screens; then exit 0; fi
          echo
          echo "docs/screens moved when the shots were retaken:"
          git status --porcelain -- docs/screens
          echo "Run 'bun run screenshots' and commit the pictures it writes."
          echo "On a release PR this is expected: the banner draws the version and the"
          echo "newest CHANGELOG entry, so bumping either one re-shoots the pictures."
          exit 1
