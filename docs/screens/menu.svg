<text x="34.8" y="685.0" fill="#56b6c2" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/</text>
<text x="34.8" y="704.0" fill="#56b6c2" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▸ /open    </text>
<text x="144.0" y="704.0" fill="#e4e6ea" opacity="0.6" textLength="546.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open the row under the cursor with what .grove.toml's `open` says</text>
<text x="51.6" y="723.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/setup   </text>
<text x="144.0" y="723.0" fill="#e4e6ea" opacity="0.6" textLength="462.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">fill the row under the cursor in from .grove.toml again</text>
<text x="51.6" y="742.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/rebase  </text>
<text x="144.0" y="742.0" fill="#e4e6ea" opacity="0.6" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rebase the row under the cursor onto a base you pick, changes carried</text>
<text x="51.6" y="761.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/propose </text>
<text x="144.0" y="761.0" fill="#e4e6ea" opacity="0.6" textLength="638.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open a pull request for the row under the cursor, onto the branch it sits on</text>
<text x="51.6" y="780.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/sync-all</text>
<text x="144.0" y="780.0" fill="#e4e6ea" opacity="0.6" textLength="453.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sync every worktree, not just the row under the cursor</text>
<text x="51.6" y="799.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/prune   </text>
<text x="144.0" y="799.0" fill="#e4e6ea" opacity="0.6" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">remove every worktree marked merged or gone, after asking</text>
<text x="51.6" y="818.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/review  </text>
<text x="144.0" y="818.0" fill="#e4e6ea" opacity="0.6" textLength="428.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">pick one of the open pull requests and check it out</text>
<text x="51.6" y="837.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/upstream</text>
<text x="144.0" y="837.0" fill="#e4e6ea" opacity="0.6" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">follow another repository's trunk — this is a fork of it</text>
<text x="51.6" y="856.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/refresh </text>
<text x="144.0" y="856.0" fill="#e4e6ea" opacity="0.6" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">re-read the worktrees now, without waiting for the clock</text>
<text x="51.6" y="875.0" fill="#e4e6ea" opacity="0.6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/log     </text>
<text x="144.0" y="875.0" fill="#e4e6ea" opacity="0.6" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">hide the commits under the list</text>
<text x="18.0" y="913.0" fill="#56b6c2" textLength="495.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">tip: h and l don't stop at the first fold — they keep going</text>
